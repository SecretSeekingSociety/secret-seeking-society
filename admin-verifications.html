<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Seeking Society — Admin Verifications</title>

<style>
:root{
  --bg:#080808;
  --card:#151515;
  --gold:#d8b56a;
  --gold2:#f0d79b;
  --cream:#f7f2e8;
  --muted:#aaa39a;
  --line:#302d28;
  --red:#c96b6b;
}

*{box-sizing:border-box;}

body{
  margin:0;
  background:var(--bg);
  color:var(--cream);
  font-family:Arial,sans-serif;
}

nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px;
  border-bottom:1px solid var(--line);
}

.brand{
  color:var(--gold2);
  font-family:Georgia,serif;
  letter-spacing:3px;
}

.back{
  color:var(--gold2);
  text-decoration:none;
}

.wrap{
  max-width:850px;
  margin:auto;
  padding:40px 20px 70px;
}

.eyebrow{
  color:var(--gold);
  letter-spacing:4px;
  font-size:12px;
}

h1{
  font-family:Georgia,serif;
  font-size:44px;
  font-weight:normal;
  margin:12px 0;
}

.intro{
  color:var(--muted);
  line-height:1.6;
  margin-bottom:30px;
}

.request{
  background:var(--card);
  border:1px solid var(--line);
  padding:20px;
  margin-bottom:20px;
}

.request h2{
  font-family:Georgia,serif;
  font-weight:normal;
  font-size:28px;
}

.meta{
  color:var(--muted);
  line-height:1.7;
  font-size:14px;
  word-break:break-word;
}

.preview{
  width:100%;
  max-height:500px;
  object-fit:contain;
  background:#050505;
  border:1px solid var(--line);
  margin:15px 0;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

button{
  padding:15px;
  font-weight:bold;
  letter-spacing:1px;
  cursor:pointer;
}

.approve{
  border:0;
  background:var(--gold);
  color:#080808;
}

.reject{
  background:transparent;
  color:var(--gold2);
  border:1px solid var(--red);
}

.message{
  margin-top:12px;
  color:var(--gold2);
}

.empty{
  border:1px solid var(--line);
  padding:30px;
  text-align:center;
  color:var(--muted);
  white-space:pre-wrap;
  word-break:break-word;
}
</style>
</head>

<body>

<nav>
  <div class="brand">SECRET SEEKING SOCIETY</div>
  <a class="back" href="member.html">← MEMBERS</a>
</nav>

<div class="wrap">

  <div class="eyebrow">ADMIN REVIEW</div>

  <h1>Verification requests.</h1>

  <p class="intro">
    Review pending member verification submissions.
    Verification files remain private.
  </p>

  <div id="requests">
    <div class="empty">Checking admin access...</div>
  </div>

</div>

<script>

const SUPABASE_URL =
  "https://pigbotwyalzrozvulsfh.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_pwHrihWM8OydQ4KFy01dnw_JTaQS7Pj";

const token =
  localStorage.getItem("sss_access_token");

const container =
  document.getElementById("requests");

if(!token){
  window.location.href = "auth.html";
}

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

async function checkUser(){

  const response = await fetch(
    SUPABASE_URL + "/auth/v1/user",
    {
      headers:{
        "apikey":SUPABASE_KEY,
        "Authorization":"Bearer " + token
      }
    }
  );

  if(!response.ok){
    localStorage.removeItem("sss_access_token");
    localStorage.removeItem("sss_user");
    window.location.href = "auth.html";
    return null;
  }

  return await response.json();
}

async function checkAdmin(){

  const response = await fetch(
    SUPABASE_URL + "/rest/v1/rpc/is_admin",
    {
      method:"POST",
      headers:{
        "apikey":SUPABASE_KEY,
        "Authorization":"Bearer " + token,
        "Content-Type":"application/json"
      },
      body:"{}"
    }
  );

  if(!response.ok){
    const errorText = await response.text();
    throw new Error(
      "Admin check failed: " + errorText
    );
  }

  return await response.json();
}

async function createSignedUrl(path){

  const encodedPath = path
    .split("/")
    .map(encodeURIComponent)
    .join("/");

  const response = await fetch(
    SUPABASE_URL +
    "/storage/v1/object/sign/verification-documents/" +
    encodedPath,
    {
      method:"POST",
      headers:{
        "apikey":SUPABASE_KEY,
        "Authorization":"Bearer " + token,
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        expiresIn:600
      })
    }
  );

  if(!response.ok){
    console.error(
      "Signed URL error:",
      await response.text()
    );
    return null;
  }

  const data = await response.json();

  const signedPath =
    data.signedURL || data.signedUrl;

  if(!signedPath){
    return null;
  }

  return SUPABASE_URL +
    "/storage/v1" +
    signedPath;
}

async function loadRequests(){

  container.innerHTML =
    '<div class="empty">Loading verification requests...</div>';

  const response = await fetch(
    SUPABASE_URL +
    "/rest/v1/verification_requests" +
    "?status=eq.pending" +
    "&select=id,user_id,verification_type,document_path,requested_tier,status,created_at,reviewed_at" +
    "&order=created_at.asc",
    {
      headers:{
        "apikey":SUPABASE_KEY,
        "Authorization":"Bearer " + token
      }
    }
  );

  if(!response.ok){

    const errorText =
      await response.text();

    console.error(errorText);

    container.innerHTML =
      '<div class="empty">Could not load verification requests.\n\n' +
      escapeHtml(errorText) +
      '</div>';

    return;
  }

  const requests =
    await response.json();

  if(!Array.isArray(requests) || requests.length === 0){

    container.innerHTML =
      '<div class="empty">No pending verification requests.</div>';

    return;
  }

  container.innerHTML = "";

  for(const request of requests){

    const card =
      document.createElement("div");

    card.className = "request";
    card.dataset.tier = request.requested_tier || "";
    let previewHtml = "";

    if(request.document_path){

      const signedUrl =
        await createSignedUrl(request.document_path);

      if(signedUrl){
        previewHtml = `
          <img
            class="preview"
            src="${escapeHtml(signedUrl)}"
            alt="Private verification submission"
          >
        `;
      } else {
        previewHtml = `
          <div class="message">
            Verification file exists, but preview could not be generated.
          </div>
        `;
      }
    }

    card.innerHTML = `

      <h2>
        ${escapeHtml(request.verification_type)} verification
      </h2>

      <div class="meta">
        Request ID: ${escapeHtml(request.id)}<br>
        User ID: ${escapeHtml(request.user_id)}<br>
        Status: ${escapeHtml(request.status)}<br>
        ${request.requested_tier
  ? `${request.verification_type === "net_worth"
      ? "Requested net worth tier"
      : "Requested income tier"}: ${escapeHtml(request.requested_tier)}<br>`
  : ""}
  Submitted:
        ${escapeHtml(
          new Date(request.created_at).toLocaleString()
        )}
      </div>

      ${previewHtml}

      <div class="actions">

        <button
          class="approve"
          onclick="reviewRequest(${request.id}, 'approved')"
        >
          APPROVE
        </button>

        <button
          class="reject"
          onclick="reviewRequest(${request.id}, 'rejected')"
        >
          REJECT
        </button>

      </div>

      <div
        class="message"
        id="message-${request.id}"
      ></div>
    `;

    container.appendChild(card);
  }
}

async function reviewRequest(requestId, decision){

  const message =
    document.getElementById(
      "message-" + requestId
    );

  message.textContent =
    "Saving decision...";

  const response = await fetch(
    SUPABASE_URL +
    "/rest/v1/rpc/review_verification_request",
    {
      method:"POST",
      headers:{
        "apikey":SUPABASE_KEY,
        "Authorization":"Bearer " + token,
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        request_id:requestId,
        decision:decision,
        approved_tier:
  decision === "approved"
    ? document
        .querySelector(`[data-tier="${requestId}"]`)
        ?.dataset.tier || null
    : null
      })
    }
  );

  if(!response.ok){

    const errorText =
      await response.text();

    console.error(errorText);

    message.textContent =
      "Could not save decision: " +
      errorText;

    return;
  }

  message.textContent =
    decision === "approved"
      ? "✓ Verification approved."
      : "Verification rejected.";

  setTimeout(
    loadRequests,
    600
  );
}

async function initialize(){

  try{

    const user =
      await checkUser();

    if(!user){
      return;
    }

    const admin =
      await checkAdmin();

    if(admin !== true){

      container.innerHTML =
        '<div class="empty">Access denied. This account is not an administrator.</div>';

      return;
    }

    await loadRequests();

  }catch(error){

    console.error(error);

    container.innerHTML =
      '<div class="empty">' +
      escapeHtml(error.message) +
      '</div>';
  }
}

initialize();

</script>

</body>
</html>
