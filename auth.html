<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Secret Seeking Society — Sign In</title>

<style>
:root{
  --bg:#080808;
  --card:#151515;
  --gold:#d8b56a;
  --gold2:#f0d79b;
  --cream:#f7f2e8;
  --muted:#aaa39a;
  --line:#302d28;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  background:var(--bg);
  color:var(--cream);
  font-family:Arial,sans-serif;
}

.wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px 20px;
}

.auth-card{
  width:100%;
  max-width:460px;
  background:var(--card);
  border:1px solid var(--line);
  padding:34px 26px;
}

.brand{
  text-align:center;
  font-family:Georgia,"Times New Roman",serif;
  letter-spacing:4px;
  color:var(--gold);
  margin-bottom:28px;
}

h1{
  font-family:Georgia,"Times New Roman",serif;
  font-weight:normal;
  text-align:center;
  font-size:38px;
  margin:0 0 10px;
}

.subtitle{
  text-align:center;
  color:var(--muted);
  line-height:1.6;
  margin-bottom:28px;
}

.tabs{
  display:flex;
  margin-bottom:24px;
}

.tabs button{
  width:50%;
  padding:13px;
  background:#0b0b0b;
  border:1px solid var(--line);
  color:var(--cream);
  cursor:pointer;
}

.tabs button.active{
  background:var(--gold);
  color:#111;
}

label{
  display:block;
  margin:0 0 7px;
  color:#d7d0c5;
  font-size:13px;
}

input{
  width:100%;
  padding:15px;
  margin-bottom:18px;
  background:#0b0b0b;
  color:white;
  border:1px solid #37332d;
  font-size:15px;
}

.main-button{
  width:100%;
  padding:16px;
  background:var(--gold);
  color:#111;
  border:0;
  font-weight:bold;
  letter-spacing:1px;
  cursor:pointer;
}

.message{
  margin-top:18px;
  text-align:center;
  color:var(--gold2);
  line-height:1.5;
  min-height:22px;
}

.home-link{
  display:block;
  margin-top:24px;
  text-align:center;
  color:var(--muted);
}
</style>
</head>

<body>

<div class="wrap">
  <div class="auth-card">

    <div class="brand">SECRET SEEKING SOCIETY</div>

    <h1 id="title">Create account.</h1>

    <div class="subtitle" id="subtitle">
      Join the private community.
    </div>

    <div class="tabs">
      <button id="signupTab" class="active" onclick="showSignup()">
        SIGN UP
      </button>

      <button id="loginTab" onclick="showLogin()">
        SIGN IN
      </button>
    </div>

    <form id="authForm">

      <label for="email">Email Address</label>
      <input
        id="email"
        type="email"
        placeholder="you@example.com"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        placeholder="Create a secure password"
        minlength="6"
        required
      >

      <button class="main-button" type="submit" id="submitButton">
        CREATE ACCOUNT
      </button>

    </form>

    <div class="message" id="message"></div>

    <a class="home-link" href="index.html">
      ← Back to Secret Seeking Society
    </a>

  </div>
</div>

<script>

const SUPABASE_URL = "https://pigbotwyalzrozvulsfh.supabase.co";
const SUPABASE_KEY = "sb_publishable_pwHrihWM8OydQ4KFy01dnw_JTaQS7Pj";

let mode = "signup";

function showSignup(){
  mode = "signup";

  document.getElementById("signupTab").classList.add("active");
  document.getElementById("loginTab").classList.remove("active");

  document.getElementById("title").textContent = "Create account.";
  document.getElementById("subtitle").textContent =
    "Join the private community.";

  document.getElementById("submitButton").textContent =
    "CREATE ACCOUNT";

  document.getElementById("message").textContent = "";
}

function showLogin(){
  mode = "login";

  document.getElementById("loginTab").classList.add("active");
  document.getElementById("signupTab").classList.remove("active");

  document.getElementById("title").textContent = "Welcome back.";
  document.getElementById("subtitle").textContent =
    "Sign in to your account.";

  document.getElementById("submitButton").textContent =
    "SIGN IN";

  document.getElementById("message").textContent = "";
}

document.getElementById("authForm").addEventListener("submit", async function(event){

  event.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const message = document.getElementById("message");

  message.textContent = "Please wait...";

  const endpoint =

  mode === "signup"

    ? "/auth/v1/signup?redirect_to=https%3A%2F%2Fsecretseekingsociety.github.io%2Fsecret-seeking-society%2Fauth.html"

    : "/auth/v1/token?grant_type=password";

  try {

    const response = await fetch(SUPABASE_URL + endpoint, {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "apikey":SUPABASE_KEY
      },
      body:JSON.stringify({
        email:email,
        password:password
      })
    });

    const data = await response.json();

    if(!response.ok){
      message.textContent =
        data.msg ||
        data.message ||
        data.error_description ||
        "Something went wrong.";
      return;
    }

    if(mode === "signup"){
      message.textContent =
        "Account created. Check your email to confirm your account.";
    } else {
      message.textContent = "Signed in successfully.";

      localStorage.setItem(
        "sss_access_token",
        data.access_token
      );

      localStorage.setItem(
        "sss_user",
        JSON.stringify(data.user || {})
      );
      window.location.href = "member.html";
    }

  } catch(error){
    console.error(error);
    message.textContent = "Something went wrong. Please try again.";
  }

});

</script>

</body>
</html>
