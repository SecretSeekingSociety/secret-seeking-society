<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Secret Seeking Society — Profile</title>

<style>
:root{
  --bg:#080808;
  --card:#151515;
  --gold:#d8b56a;
  --gold2:#f0d79b;
  --cream:#f7f2e8;
  --muted:#aaa39a;
  --line:#302d28;
}

*{box-sizing:border-box;}

body{
  margin:0;
  background:var(--bg);
  color:var(--cream);
  font-family:Arial,sans-serif;
}

nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 22px;
  border-bottom:1px solid var(--line);
}

.brand{
  font-family:Georgia,"Times New Roman",serif;
  color:var(--gold2);
  letter-spacing:3px;
}

.back{
  color:var(--gold2);
  text-decoration:none;
}

.wrap{
  max-width:680px;
  margin:auto;
  padding:40px 20px 70px;
}

h1{
  font-family:Georgia,"Times New Roman",serif;
  font-size:44px;
  font-weight:normal;
  margin:0 0 8px;
}

.subtitle{
  color:var(--muted);
  margin-bottom:30px;
  line-height:1.6;
}

form{
  background:var(--card);
  border:1px solid var(--line);
  padding:26px;
}

label{
  display:block;
  margin:0 0 7px;
  font-size:13px;
  color:#d7d0c5;
}

input,
select,
textarea{
  width:100%;
  padding:14px;
  margin-bottom:18px;
  background:#0b0b0b;
  border:1px solid #37332d;
  color:white;
  font-size:15px;
}

textarea{
  min-height:130px;
  resize:vertical;
}

button{
  width:100%;
  padding:16px;
  background:var(--gold);
  color:#111;
  border:0;
  font-weight:bold;
  letter-spacing:1px;
}

.message{
  margin-top:18px;
  text-align:center;
  color:var(--gold2);
  min-height:22px;
}
</style>
</head>

<body>

<nav>
  <div class="brand">SECRET SEEKING SOCIETY</div>
  <a class="back" href="member.html">← MEMBERS</a>
</nav>

<div class="wrap">

  <h1>Create your profile.</h1>

  <div class="subtitle">
    Tell other members a little about yourself and what you're looking for.
  </div>

  <form id="profileForm">

    <label for="displayName">Display Name</label>
    <input id="displayName" type="text" required>

    <label for="age">Age</label>
    <input id="age" type="number" min="18" required>

    <label for="gender">Gender</label>
    <select id="gender" required>
      <option value="">Select one</option>
      <option>Woman</option>
      <option>Man</option>
      <option>Nonbinary</option>
      <option>Prefer not to say</option>
    </select>

    <label for="role">I identify as</label>
    <select id="role" required>
      <option value="">Select one</option>
      <option>Sugar Daddy</option>
      <option>Sugar Mama</option>
      <option>Sugar Baby</option> 
      <option>Sugar Boy</option>
      <option>Dating</option>
      <option>Companionship</option>
      <option>Private Connection</option>
    </select>

    <label for="city">City</label>
    <input id="city" type="text" placeholder="Your city">

    <label for="seeking">I'm looking for</label>
    <select id="seeking" required>
      <option value="">Select one</option>
      <option>Sugar Daddy</option>
      <option>Sugar Mama</option>
      <option>Sugar Baby</option>
      <option>Sugar Boy</option>
      <option>Dating</option>
      <option>Companionship</option>
      <option>Private Connection</option>
    </select>

    <label for="bio">About Me</label>
    <textarea id="bio" placeholder="Tell members about yourself..."></textarea>

<label for="photoFile">Profile Photo</label>
<input id="photoFile" type="file" accept="image/*">

<div id="photoPreviewWrap" style="display:none; margin-bottom:18px;">
  <img
    id="photoPreview"
    alt="Profile preview"
    style="width:160px;height:160px;object-fit:cover;border:1px solid #37332d;"
  >
</div>
    <button type="submit">SAVE PROFILE</button>

    <div class="message" id="message"></div>

  </form>

</div>

<script>

const SUPABASE_URL = "https://pigbotwyalzrozvulsfh.supabase.co";
const SUPABASE_KEY = "sb_publishable_pwHrihWM8OydQ4KFy01dnw_JTaQS7Pj";

const token = localStorage.getItem("sss_access_token");

if(!token){
  window.location.href = "auth.html";
}

let currentUser = null;
let currentPhotoUrl = "";
async function getUser(){

  const response = await fetch(
    SUPABASE_URL + "/auth/v1/user",
    {
      headers:{
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + token
      }
    }
  );

  if(!response.ok){
    localStorage.removeItem("sss_access_token");
    window.location.href = "auth.html";
    return;
  }

  currentUser = await response.json();

  loadProfile();
}

async function loadProfile(){

  const response = await fetch(
    SUPABASE_URL +
    "/rest/v1/profiles?user_id=eq." +
    currentUser.id +
    "&select=*",
    {
      headers:{
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + token
      }
    }
  );

  const rows = await response.json();

  if(Array.isArray(rows) && rows.length > 0){

    const profile = rows[0];
currentPhotoUrl = profile.photo_url || "";
    document.getElementById("displayName").value = profile.display_name || "";
    document.getElementById("age").value = profile.age || "";
    document.getElementById("gender").value = profile.gender || "";
    document.getElementById("role").value = profile.role || "";
    document.getElementById("city").value = profile.city || "";
    document.getElementById("seeking").value = profile.seeking || "";
    document.getElementById("bio").value = profile.bio || "";
   if(profile.photo_url){
  document.getElementById("photoPreview").src = profile.photo_url;
  document.getElementById("photoPreviewWrap").style.display = "block";
}
  }
}
async function uploadProfilePhoto(){

  const fileInput = document.getElementById("photoFile");
  const file = fileInput.files[0];

  if(!file){
    return currentPhotoUrl;
  }

  const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
  const filePath = currentUser.id + "/" + Date.now() + "-" + safeName;

  const response = await fetch(
    SUPABASE_URL + "/storage/v1/object/profile-photos/" + filePath,
    {
      method: "POST",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + token,
        "Content-Type": file.type
      },
      body: file
    }
  );

  if(!response.ok){
    const errorText = await response.text();
    console.error(errorText);
    throw new Error("Photo upload failed");
  }

  return SUPABASE_URL +
    "/storage/v1/object/public/profile-photos/" +
    filePath;
}
document.getElementById("profileForm").addEventListener("submit", async function(event){

  event.preventDefault();

  const message = document.getElementById("message");

  message.textContent = "Saving...";
let photoUrl = currentPhotoUrl;

try {
  photoUrl = await uploadProfilePhoto();
} catch (error) {
  console.error(error);
  message.textContent = "Photo upload failed. Please try again.";
  return;
}
  const profileData = {
    user_id: currentUser.id,
    display_name: document.getElementById("displayName").value.trim(),
    age: Number(document.getElementById("age").value),
    gender: document.getElementById("gender").value,
    role: document.getElementById("role").value,
    city: document.getElementById("city").value.trim(),
    seeking: document.getElementById("seeking").value,
    bio: document.getElementById("bio").value.trim(),
    photo_url: photoUrl,
    updated_at: new Date().toISOString()
  };

  try{

    const checkResponse = await fetch(
      SUPABASE_URL +
      "/rest/v1/profiles?user_id=eq." +
      currentUser.id +
      "&select=id",
      {
        headers:{
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + token
        }
      }
    );

    const existing = await checkResponse.json();

    let response;

    if(Array.isArray(existing) && existing.length > 0){

      response = await fetch(
        SUPABASE_URL +
        "/rest/v1/profiles?user_id=eq." +
        currentUser.id,
        {
          method:"PATCH",
          headers:{
            "Content-Type":"application/json",
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + token,
            "Prefer":"return=minimal"
          },
          body:JSON.stringify(profileData)
        }
      );

    } else {

      response = await fetch(
        SUPABASE_URL + "/rest/v1/profiles",
        {
          method:"POST",
          headers:{
            "Content-Type":"application/json",
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + token,
            "Prefer":"return=minimal"
          },
          body:JSON.stringify(profileData)
        }
      );

    }

    if(!response.ok){

      const errorText = await response.text();
      console.error(errorText);

      message.textContent = "Something went wrong. Please try again.";
      return;
    }

    message.textContent = "Profile saved successfully.";

  }catch(error){

    console.error(error);
    message.textContent = "Something went wrong. Please try again.";
  }

});

getUser();

</script>

</body>
</html>
